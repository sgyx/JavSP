name: PyInstaller

# 打包Windows单文件exe
on:
  push:
    branches:
    - master
  workflow_dispatch:

jobs:
  build:
    name: Build single-file exe on windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      - name: Install poetry
        run: pipx install poetry

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'poetry'

      - name: Setup dynamic versioning
        run: poetry self add poetry-dynamic-versioning

      - name: Install dependencies
        run: poetry install

      - name: Build with PyInstaller
        run: poetry run pyinstaller JavSP.spec --noconfirm

      # 在一个空目录中运行exe：应能生成默认配置、加载全部抓取器并扫描到空文件夹后退出
      # 通过环境变量指定扫描目录，避免弹出选择文件夹的对话框导致卡住
      - name: Smoke test
        shell: bash
        run: |
          mkdir smoke smoke-movies && cp dist/JavSP.exe smoke/
          env "JAVSP_SCANNER.INPUT_DIRECTORY=$(cd smoke-movies && pwd -W)" \
            ./smoke/JavSP.exe < /dev/null > smoke.log 2>&1 || true
          cat smoke.log
          test -f smoke/config.yml
          grep -q "未找到影片文件" smoke.log
          ! grep -q "抓取器无效" smoke.log

      - name: Set VERSION variable
        shell: bash
        run: |
          echo "VERSION=`poetry run python tools/version.py`" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavSP-${{ env.VERSION }}-Windows-amd64
          path: dist/JavSP.exe
